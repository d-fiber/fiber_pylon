name: ci

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_CHANNEL: stable

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Resolve, analyse, check the formatting and run the suite
        run: bash tool/test.sh

  headers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check licence headers
        run: bash .github/headers/check.sh

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/commits/check.sh "$BASE" "$HEAD"

  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the version and what the changelog says about it
        run: bash .github/version/check.sh

  release:
    needs: [verify, headers, commits, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write what this version is made of, if it has moved
        run: |
          set -eu
          bash .github/version/changelog.sh

          git diff --quiet CHANGELOG.md && exit 0

          version=$(awk '/^version:/ { print $2; exit }' pubspec.yaml)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "[DOC]: write what $version is made of"
          git push origin HEAD:dev

      - name: Name this commit after the version, if it has moved
        run: bash .github/version/tag.sh

  pub:
    needs: [verify, headers, commits, version]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ask pub.dev whether it is missing what pubspec.yaml declares
        id: ask
        run: bash .github/publish/ask.sh

      - name: Check that the CI was given a token of its own
        if: steps.ask.outputs.missing == 'true'
        env:
          TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -eu
          if [ -n "${TOKEN:-}" ]; then
            exit 0
          fi
          echo "pub.dev is missing this version, but no RELEASE_TOKEN is set." >&2
          echo "" >&2
          echo "A tag pushed with the token GitHub hands a run wakes no workflow, which is" >&2
          echo "why this job needs one of its own. Create a fine-grained personal access" >&2
          echo "token on this repository with Contents: read and write, and save it as the" >&2
          echo "RELEASE_TOKEN secret. Nothing is lost: push main again once it is set." >&2
          exit 1

      - uses: actions/checkout@v4
        if: steps.ask.outputs.missing == 'true'
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Name this commit for pub.dev
        if: steps.ask.outputs.missing == 'true'
        run: bash .github/publish/tag.sh

  bootstrap:
    needs: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create main from dev, but only if main has never existed
        run: |
          set -eu

          if git rev-parse --verify origin/main >/dev/null 2>&1; then
            echo "main already exists, so this is somebody's job and not the CI's."
            echo "Run the promote workflow to move dev onto it."
            exit 0
          fi

          echo "main does not exist yet, so this first green push is what creates it."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main

          echo "main now holds what dev holds. Every promotion after this one is manual."
