name: fiber_pylon
description: "Primitives to build a swappable REST SDK: one contract, interchangeable backends."
version: 2.0.0
repository: https://github.com/d-fiber/fiber_pylon

environment:
  sdk: ^3.11.0

workspace:
  - example

dependencies:
  http: ^1.6.0
  http_parser: ^4.1.2
  equatable: ^3.0.0
  meta: ^1.16.0
  rxdart: ^0.28.0
  shared_preferences: ^2.3.0
  sqflite: ^2.4.4
  path: ^1.9.1
  injectable: ^3.0.0
  get_it: ^9.2.1
  uuid: ^4.6.0
  package_info_plus: ^10.2.1
  flutter_secure_storage: ^11.2.0
  sqflite_sqlcipher: ^3.4.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  injectable_generator: ^3.1.3
  build_runner: ^2.15.1
